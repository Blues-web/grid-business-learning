<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">一度电的业务旅程</title>
  <desc id="desc">从发电、输电、变电、配电到客户用电，以及客户服务、计量采集和设备运检的业务支撑关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#e7efe9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073f37"/>
      <stop offset="1" stop-color="#0c2725"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0b5a4a" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17302e" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 34px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .sub{font:400 16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .stage-title{font:700 20px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .stage-copy{font:400 14px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .tiny{font:500 12px "SFMono-Regular","Microsoft YaHei",monospace;fill:#08735b;letter-spacing:.08em}
      .support-title{font:700 15px "PingFang SC","Microsoft YaHei",sans-serif;fill:#fffdf8}
      .support-copy{font:400 12px "PingFang SC","Microsoft YaHei",sans-serif;fill:#b8d4cc}
    </style>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="32" fill="url(#grid)"/>
  <text x="62" y="62" class="title">一度电的业务旅程</text>
  <text x="62" y="92" class="sub">电能是主线，客户服务、计量采集和设备运检共同保证“送得到、量得准、管得住”。</text>

  <g filter="url(#shadow)">
    <rect x="62" y="132" width="196" height="230" rx="22" fill="#fffdf8" stroke="#d8e1da"/>
    <rect x="283" y="132" width="196" height="230" rx="22" fill="#fffdf8" stroke="#d8e1da"/>
    <rect x="504" y="132" width="196" height="230" rx="22" fill="#fffdf8" stroke="#d8e1da"/>
    <rect x="725" y="132" width="196" height="230" rx="22" fill="#fffdf8" stroke="#d8e1da"/>
    <rect x="946" y="132" width="192" height="280" rx="22" fill="#e8f6f0" stroke="#1aa27d" stroke-width="2"/>
  </g>

  <g>
    <path d="M126 270h60l-12 34h-36z" fill="#b8c9c1"/>
    <path d="M145 246c0-28 25-44 44-26-18 15-18 23-18 26M174 244c4-31 31-38 42-17-17 11-20 18-20 30" fill="none" stroke="#a4b9b0" stroke-width="13" stroke-linecap="round"/>
    <path d="M131 304h58v25h-58z" fill="#0a6653"/>
    <circle cx="143" cy="291" r="4" fill="#d0ee76"/><circle cx="160" cy="291" r="4" fill="#d0ee76"/><circle cx="177" cy="291" r="4" fill="#d0ee76"/>
    <text x="88" y="338" class="tiny">GENERATION</text><text x="88" y="359" class="stage-title">发电</text>
    <text x="88" y="382" class="stage-copy">电源产生电能，调度</text><text x="88" y="402" class="stage-copy">维持供需平衡。</text>
  </g>
  <g>
    <path d="M365 294l-35-10 28-24-24-4M365 230l-28-23 40-12-18-17M374 294l35-10-28-24 24-4M374 230l28-23-40-12 18-17" fill="none" stroke="#087b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M359 186l10-16 10 16M358 245l11-16 11 16M355 303l14-17 14 17" fill="none" stroke="#087b60" stroke-width="4"/>
    <path d="M370 169v136" stroke="#087b60" stroke-width="3" opacity=".7"/>
    <text x="311" y="338" class="tiny">TRANSMISSION</text><text x="311" y="359" class="stage-title">输电</text>
    <text x="311" y="382" class="stage-copy">高电压、长距离把电能</text><text x="311" y="402" class="stage-copy">送往负荷区域。</text>
  </g>
  <g>
    <rect x="545" y="248" width="112" height="80" rx="6" fill="#d7ddd8"/>
    <path d="M535 248l66-40 66 40" fill="#0a6653"/>
    <path d="M555 264h26v25h-26zM581 264h26v25h-26zM607 264h26v25h-26z" fill="#fffdf8" stroke="#a4b4ad"/>
    <path d="M580 328v-22h42v22M565 328h74" fill="none" stroke="#087b60" stroke-width="4"/>
    <text x="532" y="338" class="tiny">TRANSFORMATION</text><text x="532" y="359" class="stage-title">变电</text>
    <text x="532" y="382" class="stage-copy">改变电压等级，形成</text><text x="532" y="402" class="stage-copy">下一级供电能力。</text>
  </g>
  <g>
    <rect x="780" y="238" width="54" height="72" rx="7" fill="#0a6653"/>
    <path d="M791 226h32v13h-32zM786 238h42M786 248h42M786 258h42M786 268h42M786 278h42M786 288h42M786 298h42" stroke="#d0ee76" stroke-width="3"/>
    <path d="M754 315h103M766 315v-20M845 315v-20" stroke="#087b60" stroke-width="5" stroke-linecap="round"/>
    <circle cx="807" cy="230" r="7" fill="#1aa27d"/>
    <text x="753" y="338" class="tiny">DISTRIBUTION</text><text x="753" y="359" class="stage-title">配电</text>
    <text x="753" y="382" class="stage-copy">通过线路、配变和接入</text><text x="753" y="402" class="stage-copy">设施送到用电现场。</text>
  </g>
  <g>
    <path d="M1015 262l58-45 58 45v65h-116z" fill="none" stroke="#075348" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1044 327v-41h27v41M1088 244v-24M1097 220l-18 1" stroke="#087b60" stroke-width="4" stroke-linecap="round"/>
    <rect x="1067" y="277" width="20" height="25" rx="2" fill="#0a6653"/>
    <text x="981" y="338" class="tiny" style="fill:#08735b">CONSUMPTION</text><text x="995" y="362" class="stage-title">用电</text>
    <text x="978" y="383" class="stage-copy">客户设备实际用电，</text><text x="978" y="403" class="stage-copy">形成用电需求。</text>
  </g>

  <g opacity=".75">
    <path d="M258 246h25M479 246h25M700 246h25M921 246h25" stroke="#86a29a" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M270 241l12 5-12 5M491 241l12 5-12 5M712 241l12 5-12 5M933 241l12 5-12 5" fill="#86a29a"/>
  </g>

  <rect x="62" y="412" width="1076" height="148" rx="24" fill="#e8f6f0" stroke="#9fcdbd"/>
  <text x="88" y="447" class="support-title" style="fill:#17302e">三类业务共同支撑</text>
  <text x="88" y="470" class="support-copy" style="fill:#526764">不要只看物理设备，还要看每类设备处于哪个业务流程中。</text>
  <g>
    <rect x="90" y="491" width="300" height="46" rx="12" fill="#fffdf8" stroke="#b8d4cc"/>
    <text x="112" y="519" class="support-title" style="fill:#17302e">客户服务</text>
    <text x="200" y="519" class="support-copy" style="fill:#526764">申请接电、用电变更、费用与服务</text>
    <rect x="450" y="491" width="300" height="46" rx="12" fill="#fffdf8" stroke="#b8d4cc"/>
    <text x="472" y="519" class="support-title" style="fill:#17302e">计量采集</text>
    <text x="560" y="519" class="support-copy" style="fill:#526764">现场计量、数据上传与核对</text>
    <rect x="810" y="491" width="300" height="46" rx="12" fill="#fffdf8" stroke="#b8d4cc"/>
    <text x="832" y="519" class="support-title" style="fill:#17302e">设备运检</text>
    <text x="920" y="519" class="support-copy" style="fill:#526764">巡视、缺陷、检修与消缺</text>
  </g>
</svg>
