<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">单相 220V 与三相 380V 示意</title>
  <desc id="desc">单相 220V 由一根相线和一根中性线构成，常见于居民和小功率用电；三相 380V 由三根相线和一根中性线构成，常见于电机、较大商业和工业负荷。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ed"/><stop offset="1" stop-color="#e5f0e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#17302e" flood-opacity=".12"/></filter>
    <style>
      .h{font:700 30px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .s{font:400 14px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .card-title{font:700 21px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .voltage{font:700 28px "SFMono-Regular","Microsoft YaHei",monospace;fill:#075348}
      .copy{font:400 13px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .label{font:700 13px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .small{font:700 11px "SFMono-Regular","Microsoft YaHei",monospace;fill:#08735b}
    </style>
  </defs>
  <rect width="1100" height="680" rx="30" fill="url(#bg)"/>
  <text x="48" y="54" class="h">单相 220V 与三相 380V 怎么理解</text>
  <text x="48" y="81" class="s">这是我国低压用电中最常见的两种供电形式。最终要看供电方案、电能表铭牌、现场线路和用电设备，不能只按“住宅/工厂”猜测。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="116" width="480" height="458" rx="24" fill="#fffdf8" stroke="#d3ddd7"/>
    <rect x="572" y="116" width="480" height="458" rx="24" fill="#fffdf8" stroke="#d3ddd7"/>
  </g>

  <g>
    <text x="76" y="154" class="card-title">单相供电</text>
    <text x="76" y="184" class="voltage">220 V</text>
    <text x="76" y="214" class="copy">常见：居民家庭、小功率电器</text>

    <path d="M146 274l70-58 70 58v90h-140z" fill="#e8f6f0" stroke="#075348" stroke-width="4" stroke-linejoin="round"/>
    <rect x="187" y="316" width="32" height="48" rx="3" fill="#0a6653"/>
    <rect x="217" y="292" width="26" height="24" rx="3" fill="#d0ee76"/>

    <path d="M352 274v90" stroke="#b84b3e" stroke-width="6" stroke-linecap="round"/>
    <path d="M384 274v90" stroke="#466f86" stroke-width="6" stroke-linecap="round"/>
    <circle cx="352" cy="248" r="22" fill="#fbeae7" stroke="#b84b3e" stroke-width="2"/>
    <text x="345" y="254" class="label">L</text>
    <circle cx="384" cy="248" r="22" fill="#edf3f6" stroke="#466f86" stroke-width="2"/>
    <text x="375" y="254" class="label">N</text>
    <text x="324" y="302" class="copy">相线</text>
    <text x="381" y="302" class="copy">中性线</text>
    <path d="M226 319h85M311 319h25" stroke="#9aaca5" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="234" y="342" class="small">相线与中性线之间约 220V</text>

    <rect x="76" y="398" width="424" height="140" rx="16" fill="#f5f3ea" stroke="#e0ded4"/>
    <text x="96" y="428" class="label">生活里的典型设备</text>
    <text x="96" y="454" class="copy">照明、电视、冰箱、普通插座、常见的家用空调和热水器。</text>
    <text x="96" y="480" class="copy">典型理解：一根相线 + 一根中性线，电压约 220V，承载功率通常较小。</text>
    <text x="96" y="516" class="small">注意：别墅、小型商铺或大功率家用设备也可能申请三相供电</text>
  </g>

  <g>
    <text x="600" y="154" class="card-title">三相供电</text>
    <text x="600" y="184" class="voltage">380 V / 220 V</text>
    <text x="600" y="214" class="copy">常见：电机、较大商业、工业与动力设备</text>

    <path d="M660 294l87-70 87 70v100h-174z" fill="#e8f6f0" stroke="#075348" stroke-width="4" stroke-linejoin="round"/>
    <path d="M674 314h45v58h-45zM735 314h45v58h-45z" fill="#fffdf8" stroke="#a5bbb2"/>
    <path d="M699 274h96M714 253h66" stroke="#9bb2a9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="748" cy="256" r="20" fill="#d0ee76" stroke="#08735d" stroke-width="3"/>
    <path d="M738 256h20M748 246v20" stroke="#075348" stroke-width="3"/>

    <g>
      <path d="M912 238v126" stroke="#c97823" stroke-width="5" stroke-linecap="round"/>
      <path d="M948 238v126" stroke="#1aa27d" stroke-width="5" stroke-linecap="round"/>
      <path d="M984 238v126" stroke="#466f86" stroke-width="5" stroke-linecap="round"/>
      <path d="M1020 238v126" stroke="#8b9692" stroke-width="5" stroke-linecap="round"/>
      <text x="900" y="222" class="small">L1</text><text x="936" y="222" class="small">L2</text><text x="972" y="222" class="small">L3</text><text x="1008" y="222" class="small">N</text>
    </g>
    <path d="M912 281h108M912 306h108" stroke="#a8b7b1" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="870" y="347" class="small">三根相线之间约 380V</text>
    <text x="870" y="369" class="small">相线与中性线之间约 220V</text>

    <rect x="600" y="398" width="424" height="140" rx="16" fill="#f5f3ea" stroke="#e0ded4"/>
    <text x="620" y="428" class="label">生活里的典型场景</text>
    <text x="620" y="454" class="copy">三相电机、较大功率空调或泵类、商铺、小型车间和工业动力设备。</text>
    <text x="620" y="480" class="copy">典型理解：三根相线 + 中性线（并按现场配置保护接地），动力负荷更大。</text>
    <text x="620" y="516" class="small">注意：三相 380V 设备也可能使用 220V 控制回路，不能只看一个大数字</text>
  </g>

  <g transform="translate(48 603)">
    <rect width="1004" height="48" rx="12" fill="#073f37"/>
    <text x="22" y="30" fill="#d0ee76" font-size="13" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="700">研发判断口诀</text>
    <text x="126" y="30" fill="#fffdf8" font-size="13" font-family="PingFang SC,Microsoft YaHei,sans-serif">住宅常见单相 220V，动力负荷常见三相 380V；最终以供电方案、表计铭牌和现场接线为准。</text>
  </g>
</svg>
