    <path d="M356 442v47H278v82M356 489h74v46M356 489h185v46M618 442v47H565v43M618 489h62v43M884 442v47H835v43M884 489h62v43"/>
  </g>
  <g fill="#fffdf8" stroke="#5c897d">
    <rect x="254" y="570" width="45" height="58" rx="5"/><rect x="311" y="570" width="45" height="58" rx="5"/><rect x="368" y="570" width="45" height="58" rx="5"/>
    <rect x="516" y="570" width="45" height="58" rx="5"/><rect x="573" y="570" width="45" height="58" rx="5"/><rect x="630" y="570" width="45" height="58" rx="5"/>
    <rect x="778" y="570" width="45" height="58" rx="5"/><rect x="835" y="570" width="45" height="58" rx="5"/><rect x="892" y="570" width="45" height="58" rx="5"/>
  </g>
  <g fill="#1aa27d">
    <circle cx="268" cy="586" r="5"/><circle cx="325" cy="586" r="5"/><circle cx="382" cy="586" r="5"/>
    <circle cx="530" cy="586" r="5"/><circle cx="587" cy="586" r="5"/><circle cx="644" cy="586" r="5"/>
    <circle cx="792" cy="586" r="5"/><circle cx="849" cy="586" r="5"/><circle cx="906" cy="586" r="5"/>
  </g>
