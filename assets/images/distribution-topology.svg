<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">配电网与台区拓扑示意</title>
  <desc id="desc">变电站通过中压配电线路连接多台配电变压器，每台变压器形成低压台区，台区内有低压线路、计量箱和客户。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#e9f0ea"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#0b6d58" opacity=".12"/></pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163b34" flood-opacity=".12"/></filter>
    <style>
      .h{font:700 31px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .s{font:400 15px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .lbl{font:700 16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .sm{font:400 13px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .zone{font:700 13px "SFMono-Regular","Microsoft YaHei",monospace;fill:#08735b;letter-spacing:.06em}
    </style>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#paper)"/>
  <rect width="1200" height="760" rx="30" fill="url(#dots)"/>
  <text x="54" y="57" class="h">配电网、台区与客户的关系</text>
  <text x="54" y="84" class="s">图中是典型示意，实际网架可能是架空线、电缆、环网或辐射结构，具体以现场拓扑为准。</text>

  <g filter="url(#softShadow)">
    <rect x="54" y="132" width="142" height="135" rx="18" fill="#073f37"/>
    <rect x="69" y="151" width="112" height="70" rx="6" fill="#d9e1dc"/>
    <path d="M56 151l69-35 69 35" fill="#0d6957"/>
    <path d="M84 169h25v24H84zM111 169h25v24h-25zM138 169h25v24h-25z" fill="#fffdf8" stroke="#9db2aa"/>
    <path d="M100 221v29M125 221v29M150 221v29" stroke="#d0ee76" stroke-width="4"/>
    <text x="83" y="256" class="lbl" style="fill:#fff;font-size:18px">变电站</text>
  </g>

  <path d="M196 199H356" stroke="#c97823" stroke-width="7" stroke-linecap="round"/>
  <path d="M356 199v136M356 199h262M618 199h266" stroke="#c97823" stroke-width="7" stroke-linecap="round"/>
  <path d="M356 335v107M618 335v107M884 335v107" stroke="#0b8a6c" stroke-width="7" stroke-linecap="round"/>
  <g>
    <rect x="448" y="124" width="166" height="34" rx="17" fill="#fff4df" stroke="#e6c18d"/>
    <text x="466" y="146" class="zone">中压配电线路 · 10 kV</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="300" y="335" width="112" height="96" rx="14" fill="#fffdf8" stroke="#a8b9b2"/>
    <rect x="328" y="347" width="56" height="59" rx="6" fill="#0a6653"/>
    <path d="M338 359h36M338 369h36M338 379h36M338 389h36" stroke="#d0ee76" stroke-width="3"/>
    <circle cx="356" cy="414" r="7" fill="#1aa27d"/>
    <text x="309" y="451" class="lbl">配变 1</text>
    <rect x="562" y="335" width="112" height="96" rx="14" fill="#fffdf8" stroke="#a8b9b2"/>
    <rect x="590" y="347" width="56" height="59" rx="6" fill="#0a6653"/>
    <path d="M600 359h36M600 369h36M600 379h36M600 389h36" stroke="#d0ee76" stroke-width="3"/>
    <circle cx="618" cy="414" r="7" fill="#1aa27d"/>
    <text x="571" y="451" class="lbl">配变 2</text>
    <rect x="828" y="335" width="112" height="96" rx="14" fill="#fffdf8" stroke="#a8b9b2"/>
    <rect x="856" y="347" width="56" height="59" rx="6" fill="#0a6653"/>
    <path d="M866 359h36M866 369h36M866 379h36M866 389h36" stroke="#d0ee76" stroke-width="3"/>
    <circle cx="884" cy="414" r="7" fill="#1aa27d"/>
    <text x="837" y="451" class="lbl">配变 3</text>
  </g>

  <g fill="#e8f6f0" stroke="#1aa27d" stroke-width="2">
