  <text x="233" y="535" class="zone">低压台区 A</text>
  <text x="495" y="535" class="zone">低压台区 B</text>
  <text x="757" y="535" class="zone">低压台区 C</text>
  <text x="250" y="649" class="sm">计量箱 / 客户</text>
  <text x="512" y="649" class="sm">计量箱 / 客户</text>
  <text x="774" y="649" class="sm">计量箱 / 客户</text>

  <g transform="translate(54 700)">
    <path d="M0 8h45" stroke="#c97823" stroke-width="6" stroke-linecap="round"/><text x="56" y="14" class="sm">中压线路</text>
    <path d="M154 8h45" stroke="#0b8a6c" stroke-width="6" stroke-linecap="round"/><text x="210" y="14" class="sm">低压供电</text>
    <rect x="333" y="0" width="20" height="17" rx="3" fill="#fffdf8" stroke="#5c897d"/><text x="363" y="14" class="sm">计量箱</text>
    <circle cx="507" cy="8" r="7" fill="#1aa27d"/><text x="522" y="14" class="sm">客户接入</text>
    <text x="749" y="14" class="sm">业务含义：台区是“配变 + 低压供电范围 + 范围内计量与客户”的管理组合</text>
  </g>
</svg>
