<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">配电网现场常用设备图册</title>
  <desc id="desc">配电变压器、环网柜或开关柜、电缆分支箱、计量箱、智能电能表、采集终端六类设备的示意。</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5ee"/><stop offset="1" stop-color="#e7f0e9"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17302e" flood-opacity=".1"/></filter>
    <style>
      .h{font:700 31px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .s{font:400 14px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .name{font:700 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#17302e}
      .copy{font:400 14px "PingFang SC","Microsoft YaHei",sans-serif;fill:#526764}
      .tag{font:700 11px "SFMono-Regular","Microsoft YaHei",monospace;fill:#08735b;letter-spacing:.07em}
    </style>
  </defs>
  <rect width="1200" height="900" rx="30" fill="url(#g)"/>
  <text x="52" y="56" class="h">现场设备识别图册</text>
  <text x="52" y="83" class="s">先用“设备外形和所在位置”认对象，再理解它在业务中承担什么作用。以下为教学示意，不代表唯一型号。</text>

  <g filter="url(#sh)">
    <rect x="52" y="112" width="348" height="350" rx="22" fill="#fffdf8" stroke="#d7dfd9"/>
    <rect x="426" y="112" width="348" height="350" rx="22" fill="#fffdf8" stroke="#d7dfd9"/>
    <rect x="800" y="112" width="348" height="350" rx="22" fill="#fffdf8" stroke="#d7dfd9"/>
    <rect x="52" y="488" width="348" height="350" rx="22" fill="#fffdf8" stroke="#d7dfd9"/>
    <rect x="426" y="488" width="348" height="350" rx="22" fill="#fffdf8" stroke="#d7dfd9"/>
    <rect x="800" y="488" width="348" height="350" rx="22" fill="#fffdf8" stroke="#d7dfd9"/>
  </g>

  <g>
    <text x="76" y="143" class="tag">01 · TRANSFORMER</text>
    <rect x="176" y="209" width="87" height="123" rx="10" fill="#0a6653"/>
    <path d="M189 228h60M189 243h60M189 258h60M189 273h60M189 288h60M189 303h60" stroke="#d0ee76" stroke-width="4"/>
    <rect x="155" y="268" width="18" height="46" rx="4" fill="#a8b9b2"/><rect x="265" y="268" width="18" height="46" rx="4" fill="#a8b9b2"/>
    <path d="M219 209V171M154 342h130" stroke="#087b60" stroke-width="6" stroke-linecap="round"/>
    <circle cx="219" cy="171" r="8" fill="#1aa27d"/>
    <text x="76" y="378" class="name">配电变压器</text>
    <text x="76" y="405" class="copy">把中压降到低压，是台区的核心设备。</text>
    <text x="76" y="430" class="copy">关注容量、运行状态和供电范围。</text>
  </g>

  <g>
    <text x="450" y="143" class="tag">02 · SWITCHGEAR</text>
    <rect x="518" y="178" width="160" height="176" rx="10" fill="#d9e1dc" stroke="#9bb2a9" stroke-width="2"/>
    <path d="M518 219h160M518 274h160" stroke="#7f9c92" stroke-width="2"/>
    <rect x="535" y="190" width="51" height="20" rx="4" fill="#0a6653"/><rect x="598" y="190" width="51" height="20" rx="4" fill="#0a6653"/>
    <circle cx="550" cy="243" r="10" fill="#fffdf8" stroke="#1aa27d" stroke-width="3"/><circle cx="620" cy="243" r="10" fill="#fffdf8" stroke="#1aa27d" stroke-width="3"/>
    <path d="M550 253v25M620 253v25" stroke="#7f9c92" stroke-width="4"/>
    <text x="450" y="378" class="name">环网柜 / 开关柜</text>
    <text x="450" y="405" class="copy">用于中压线路的分接、联络和操作。</text>
    <text x="450" y="430" class="copy">现场要识别名称、间隔和所在线路。</text>
  </g>

  <g>
    <text x="824" y="143" class="tag">03 · BRANCH BOX</text>
    <rect x="898" y="188" width="152" height="160" rx="9" fill="#f0f1eb" stroke="#90a79e" stroke-width="3"/>
    <path d="M922 213h104M922 238h104M922 263h104M922 288h104" stroke="#9bb2a9" stroke-width="3"/>
    <circle cx="942" cy="238" r="6" fill="#c97823"/><circle cx="1006" cy="263" r="6" fill="#1aa27d"/><circle cx="970" cy="313" r="7" fill="#0a6653"/>
    <path d="M898 348h152" stroke="#087b60" stroke-width="5"/>
    <text x="824" y="378" class="name">电缆分支箱</text>
    <text x="824" y="405" class="copy">把电缆线路分成多个支路，承接现场接入。</text>
    <text x="824" y="430" class="copy">拓扑中常作为计量箱的上级节点。</text>
  </g>

  <g>
    <text x="76" y="519" class="tag">04 · METER CABINET</text>
    <rect x="148" y="548" width="210" height="174" rx="10" fill="#f0f1eb" stroke="#819b91" stroke-width="4"/>
    <path d="M166 576h174v76H166z" fill="#fffdf8" stroke="#b6c5bf"/>
    <rect x="179" y="588" width="43" height="51" rx="4" fill="#0a6653"/><rect x="232" y="588" width="43" height="51" rx="4" fill="#0a6653"/>
    <rect x="285" y="588" width="43" height="51" rx="4" fill="#0a6653"/>
    <path d="M186 600h29M186 610h29M239 600h29M239 610h29M292 600h29M292 610h29" stroke="#d0ee76" stroke-width="2"/>
    <circle cx="253" cy="681" r="8" fill="#c97823"/>
    <text x="76" y="760" class="name">计量箱</text>
    <text x="76" y="787" class="copy">容纳电能表、开关、互感器等计量设施。</text>
    <text x="76" y="812" class="copy">重点理解箱组、表位、箱内设备和客户关系。</text>
  </g>

  <g>
    <text x="450" y="519" class="tag">05 · SMART METER</text>
    <rect x="527" y="553" width="142" height="174" rx="16" fill="#fffdf8" stroke="#96aca3" stroke-width="4"/>
    <rect x="546" y="576" width="104" height="52" rx="6" fill="#dff2e8"/>
    <text x="566" y="608" fill="#08735b" font-size="21" font-family="SFMono-Regular,monospace" font-weight="700">000.00</text>
    <circle cx="565" cy="660" r="11" fill="#0a6653"/><circle cx="598" cy="660" r="11" fill="#0a6653"/><circle cx="631" cy="660" r="11" fill="#0a6653"/>
    <path d="M570 694h56M577 707h42" stroke="#9bb2a9" stroke-width="3"/>
    <text x="450" y="760" class="name">智能电能表</text>
    <text x="450" y="787" class="copy">记录用户电能，是电量和结算的重要依据。</text>
    <text x="450" y="812" class="copy">现场关注表号、参数、接线、封印和示值。</text>
  </g>

  <g>
    <text x="824" y="519" class="tag">06 · COLLECTION TERMINAL</text>
    <rect x="892" y="555" width="168" height="142" rx="13" fill="#0a6653"/>
    <rect x="914" y="576" width="124" height="70" rx="6" fill="#dff2e8"/>
    <path d="M934 595h84M934 610h84M934 625h55" stroke="#87aea3" stroke-width="3"/>
    <path d="M923 656h106" stroke="#d0ee76" stroke-width="4"/>
    <path d="M961 681v37M989 681v37" stroke="#d0ee76" stroke-width="5" stroke-linecap="round"/>
    <text x="824" y="760" class="name">采集终端</text>
    <text x="824" y="787" class="copy">通过通信通道把现场电能表数据送往采集主站。</text>
    <text x="824" y="812" class="copy">现场关注安装位置、通信、表计关系和运行状态。</text>
  </g>
</svg>
